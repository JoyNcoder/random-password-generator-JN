<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Random Password Generator</title>
        <link rel="stylesheet" href="css.css"> 
    </head>
    <body>
        <h1 class="title">Random Password Generator</h1>
        <div class="container">
            <div class="length">
                <label>Choose your password length (at least 6)</label>
                <input type="number" min="6" max="50" id="passLength" placeholder=" ">
            </div>
            <div class="lowercase">
                <label for="lowerCase">Want Lowercase Letters?</label>
                <div class="checkbox-wrapper-10">
                    <input class="tgl tgl-flip" type="checkbox" id="lowerCase"/>
                    <label class="tgl-btn" data-tg-off="Nope" data-tg-on="Yeah!" for="lowerCase"></label>
                </div>
            </div>
            <div class="uppercase">
                <label for="upperCase">Want Uppercase Letters?</label>
                <div class="checkbox-wrapper-10">
                    <input class="tgl tgl-flip" type="checkbox" id="upperCase"/>
                    <label class="tgl-btn" data-tg-off="Nope" data-tg-on="Yeah!" for="upperCase"></label>
                </div>
            </div>
            <div class="numbers">
                <label for="Numbers">Want Random Numbers?</label>
                <div class="checkbox-wrapper-10">
                    <input class="tgl tgl-flip" type="checkbox" id="Numbers"/>
                    <label class="tgl-btn" data-tg-off="Nope" data-tg-on="Yeah!" for="Numbers"></label>
                </div>
            </div>
            <div class="spchar">
                <label for="spChar">Want Special Characters?</label>
                <div class="checkbox-wrapper-10">
                    <input class="tgl tgl-flip" type="checkbox" id="spChar"/>
                    <label class="tgl-btn" data-tg-off="Nope" data-tg-on="Yeah!" for="spChar"></label>
                </div>
            </div>
            <button id="Generate" onclick="makePassword()">Make My Password</button>
            <h3 id="Result"></h3>
            <div class="passDiv">
                <input readonly id="password">
            </div>
        </div>


     <script src="script.js"></script>
    </body>
</html>
